name: Deploy Elite CBT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend deps
        run: |
          cd backend
          npm ci --omit=dev

      - name: Deploy to VPS
        run: |
          DEST=/var/www/html/elite/elite-cbt
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude .git \
            ./ "$DEST/"

      - name: Restart service
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart elite-cbt-api
          sleep 2
          if systemctl is-active --quiet elite-cbt-api; then
            echo "✓ elite-cbt-api running"
          else
            echo "✗ elite-cbt-api FAILED"
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl status elite-cbt-api --no-pager
            exit 1
          fi
